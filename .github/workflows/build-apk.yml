name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        env:
          LIVEKIT_TOKEN_SERVER_ID: ${{ secrets.LIVEKIT_TOKEN_SERVER_ID }}
          RIDE_SERVER_URL: ${{ secrets.RIDE_SERVER_URL }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ./gradlew testReleaseUnitTest assembleRelease assembleUnshrunk --console=plain
          # 64-bit phones (nearly all since ~2017) get the main APK; old 32-bit phones their own.
          mv app/build/outputs/apk/release/app-arm64-v8a-release.apk RideComm.apk
          mv app/build/outputs/apk/release/app-armeabi-v7a-release.apk RideComm-32bit.apk
          # Fallback without R8 shrinking, in case shrinking breaks something on a real phone.
          mv app/build/outputs/apk/unshrunk/app-arm64-v8a-unshrunk.apk RideComm-unshrunk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RideComm-${{ github.run_number }}
          path: RideComm*.apk

      # For the Play Store: an app bundle signed with the private upload key, only when its secrets are set
      # (UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD; see PLAY_STORE.md).
      # Kept as a download on the run's page only, not on the public release.
      - name: Play Store bundle
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          LIVEKIT_TOKEN_SERVER_ID: ${{ secrets.LIVEKIT_TOKEN_SERVER_ID }}
          RIDE_SERVER_URL: ${{ secrets.RIDE_SERVER_URL }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          BUILD_NUMBER: ${{ github.run_number }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew bundlePlay --console=plain
          rm -f "$RUNNER_TEMP/upload.jks"
          mv app/build/outputs/bundle/play/app-play.aab RideComm-play-${{ github.run_number }}.aab

      - uses: actions/upload-artifact@v4
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: RideComm-play-${{ github.run_number }}
          path: RideComm-play-*.aab

      # A fixed "latest" pre-release gives one link to download the newest APK on a phone.
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest RideComm.apk RideComm-32bit.apk RideComm-unshrunk.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "RideComm latest build #${{ github.run_number }}" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Download RideComm.apk below and install it on your phone. RideComm-32bit.apk is for old phones that say the app isn't compatible; RideComm-unshrunk.apk is a bigger fallback if RideComm.apk misbehaves."
