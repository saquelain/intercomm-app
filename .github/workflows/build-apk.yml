name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        env:
          LIVEKIT_TOKEN_SERVER_ID: ${{ secrets.LIVEKIT_TOKEN_SERVER_ID }}
          RIDE_SERVER_URL: ${{ secrets.RIDE_SERVER_URL }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ./gradlew testReleaseUnitTest assembleRelease --console=plain
          mv app/build/outputs/apk/release/app-release.apk RideComm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RideComm-${{ github.run_number }}
          path: RideComm.apk

      # A fixed "latest" pre-release gives one link to download the newest APK on a phone.
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest RideComm.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "RideComm latest build #${{ github.run_number }}" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Download RideComm.apk below and install it on your phone."
