name: Deploy ride server

# Deploys server/token-worker to Cloudflare Workers. Needs these repository secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID          (Cloudflare account)
#   LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET     (LiveKit Cloud > Settings > Keys)
#   GROUP_SECRET                                         (your group key, shared only with riders)
# Without CLOUDFLARE_API_TOKEN the job is skipped.

on:
  push:
    paths:
      - "server/token-worker/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Test the worker
        working-directory: server/token-worker
        run: node test.mjs > /dev/null

      - name: Deploy to Cloudflare
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server/token-worker
          secrets: |
            LIVEKIT_URL
            LIVEKIT_API_KEY
            LIVEKIT_API_SECRET
            GROUP_SECRET
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          GROUP_SECRET: ${{ secrets.GROUP_SECRET }}

      - name: Not deployed
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN secret (and the others listed in this file) to deploy the ride server."
