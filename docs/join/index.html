<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join ride · RideComm</title>
<meta name="description" content="Tap to join your group's RideComm ride.">
<meta name="theme-color" content="#070A14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #070A14; --deep: #0E0B22; --text: rgba(255,255,255,.96); --muted: rgba(255,255,255,.7);
    --orange: #FF8A1F; --pink: #FF3D81; --violet: #7C5CFF; --cyan: #22D3EE;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: Outfit, system-ui, sans-serif; color: var(--text);
    background: linear-gradient(var(--night), var(--deep)); display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; overflow-x: hidden;
  }
  .glow { position: fixed; border-radius: 50%; filter: blur(70px); opacity: .55; z-index: 0; pointer-events: none; }
  .g1 { width: 70vw; height: 70vw; background: var(--violet); top: -20vw; left: -20vw; }
  .g2 { width: 60vw; height: 60vw; background: var(--pink); top: 30vh; right: -25vw; opacity: .4; }
  .g3 { width: 60vw; height: 60vw; background: var(--cyan); bottom: -25vw; left: -10vw; opacity: .3; }
  .card {
    position: relative; z-index: 1; width: 100%; max-width: 420px; padding: 28px 24px; border-radius: 28px; text-align: center;
    background: linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
    border: 1px solid rgba(255,255,255,.28); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  }
  .logo { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 20px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--orange), var(--pink)); border: 1px solid rgba(255,255,255,.4); }
  h1 { margin: 0; font-size: 26px; font-weight: 800; }
  p { margin: 8px 0 0; color: var(--muted); font-size: 16px; }
  .label { margin-top: 24px; font-size: 13px; letter-spacing: 1.4px; color: rgba(255,255,255,.5); font-weight: 600; }
  .code { font-size: 44px; font-weight: 800; letter-spacing: 8px; margin: 4px 0 22px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 62px; border-radius: 999px;
    font: 600 18px Outfit, sans-serif; color: #fff; text-decoration: none; border: 1px solid rgba(255,255,255,.35); }
  .primary { background: linear-gradient(90deg, var(--orange), var(--pink)); }
  .secondary { margin-top: 12px; background: rgba(255,255,255,.1); }
  .hint { margin-top: 18px; font-size: 14px; }
  .bad .code, .bad .primary { display: none; }
  /* A planned ride (from "#p=" in the link) */
  .plan { text-align: left; margin: -6px 0 22px; padding: 16px 18px; border-radius: 22px; background: rgba(124,92,255,.18); border: 1px solid rgba(185,168,255,.5); }
  .plan .title { font-size: 20px; font-weight: 800; overflow-wrap: anywhere; }
  .plan .when { color: #fff; font-size: 17px; font-weight: 600; margin-top: 2px; }
  .plan .by { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .stop { display: flex; gap: 12px; align-items: flex-start; margin-top: 12px; }
  .stop .k { font-size: 12px; letter-spacing: 1.2px; color: rgba(255,255,255,.55); font-weight: 600; text-transform: uppercase; }
  .stop a { color: var(--text); font-size: 17px; font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
  .stop .dot { width: 12px; height: 12px; border-radius: 50%; margin-top: 18px; flex: none; background: var(--orange); }
  .stop .dot.s { background: #FFC93C; } .stop .dot.d { background: #34E89E; }
  .cal { margin-top: 14px; height: 52px; font-size: 16px; background: rgba(255,255,255,.12); }
  @media (max-width: 380px) { .card { padding: 24px 16px; } .code { font-size: 36px; letter-spacing: 5px; } }
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<main class="card" id="card">
  <div class="logo" aria-hidden="true">
    <svg width="34" height="34" viewBox="0 -960 960 960" fill="#fff"><path d="M160-200q-66 0-113-47T0-360q0-57 36.5-101t93.5-55l-28-24H30q-13 0-21.5-8.5T0-570q0-13 8.5-21.5T30-600h150l100 60 146-55q7-2 14-3.5t15-1.5h111l-62-80h-64q-17 0-28.5-11.5T400-720q0-17 11.5-28.5T440-760h63q19 0 35.5 8.5T566-729l60 77 105-53q10-5 19.5 1t9.5 17v67q0 8-6 14t-14 6h-72l70 92q15-6 30.5-9t31.5-3q66 0 113 47t47 113q0 66-47 113t-113 47q-66 0-113-47t-47-113q0-27 9.5-52.5T676-460l-20-24-124 186q-5 8-14 13t-19 5h-84q-8 0-14.5-2.5T389-290l-69-60q-5 63-51 106.5T160-200Zm0-80q33 0 56.5-23.5T240-360q0-33-23.5-56.5T160-440q-33 0-56.5 23.5T80-360q0 33 23.5 56.5T160-280Zm640 0q33 0 56.5-23.5T880-360q0-33-23.5-56.5T800-440q-33 0-56.5 23.5T720-360q0 33 23.5 56.5T800-280Z"/></svg>
  </div>
  <h1>Join the ride</h1>
  <p id="sub">Your group is riding with RideComm.</p>
  <div class="label">RIDE CODE</div>
  <div class="code" id="code">······</div>
  <div class="plan" id="plan" hidden></div>
  <a class="btn primary" id="open" href="#">Open in RideComm</a>
  <a class="btn secondary" id="get" href="https://github.com/saquelain/intercomm-app/releases/download/latest/RideComm.apk">Get the app (APK)</a>
  <a class="btn secondary" id="web" href="../ride/">Join in browser (iPhone)</a>
  <p class="hint" id="hint">Android: install the app, then come back and tap “Open in RideComm”. iPhone or no app: join in the browser.</p>
</main>
<script>
  // The ride code comes from ?code=XXXXXX (or #XXXXXX). Same alphabet the app uses.
  const params = new URLSearchParams(location.search);
  // The group key (rides locked to the group) comes after "#k=", so it never reaches the web server.
  const hash = new URLSearchParams(location.hash.slice(1));
  const key = hash.get('k') || '';
  // A planned ride (base64url JSON after "#p=", see PROTOCOL.md "Ride plans"): shown here and passed on.
  const planRaw = /^[A-Za-z0-9_-]+$/.test(hash.get('p') || '') ? hash.get('p') : '';
  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const cut = (t, n) => String(t == null ? '' : t).trim().slice(0, n);
  function place(p) {
    if (!p || typeof p !== 'object' || p.lat == null || p.lon == null) return null;
    const lat = Number(p.lat), lon = Number(p.lon);
    return isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180 ? { name: cut(p.name, 60) || 'Pinned place', lat, lon } : null;
  }
  function readPlan(raw) {
    try {
      const bin = atob(raw.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((raw.length + 3) % 4));
      const o = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))));
      const at = Number(o.at), meet = place(o.meet);
      if (!isFinite(at) || at <= 0 || !meet) return null;
      return { title: cut(o.title, 60), at, meet, stops: (Array.isArray(o.stops) ? o.stops : []).map(place).filter(Boolean).slice(0, 5), dest: place(o.dest), by: cut(o.by, 60) };
    } catch (e) { return null; }
  }
  const plan = planRaw ? readPlan(planRaw) : null;
  /** The rest of the link after "#": the plan and the group key, passed on to the app or the web page. */
  const pass = [plan ? 'p=' + planRaw : '', key ? 'k=' + encodeURIComponent(key) : ''].filter(Boolean).join('&');
  const raw = (params.get('code') || (location.hash.indexOf('=') < 0 ? location.hash.slice(1) : '') || '').toUpperCase();
  const code = /^[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{6}$/.test(raw) ? raw : null;
  const apk = document.getElementById('get').href;
  if (!code) {
    document.getElementById('card').classList.add('bad');
    document.getElementById('sub').textContent = 'This invite link is missing its ride code. Ask for the code instead.';
  } else {
    document.getElementById('code').textContent = code;
    const web = document.getElementById('web');
    web.href = '../ride/?code=' + code + (pass ? '#' + pass : '');
    if (plan) showPlan();
    // iPhone and iPad can't install the APK: the browser version is the way in.
    if (/iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
      document.getElementById('open').style.display = 'none';
      document.getElementById('get').style.display = 'none';
      web.className = 'btn primary';
      web.textContent = 'Join the ride';
      document.getElementById('hint').textContent = 'Opens RideComm in Safari: talk, listen, votes and SOS. No app needed.';
    }
    // Android intent: opens the app if installed, otherwise falls back to the APK download.
    const intent = 'intent://join/' + code + (pass ? '?' + pass : '') + '#Intent;scheme=ridecomm;package=com.ridecomm.app;' +
      'S.browser_fallback_url=' + encodeURIComponent(apk) + ';end';
    const open = document.getElementById('open');
    open.href = intent;
    if (/Android/i.test(navigator.userAgent)) location.href = intent;
  }

  /** The plan under the code: name, day and time where the viewer is, meeting point, stops, destination. */
  function showPlan() {
    const p = plan, box = document.getElementById('plan');
    const when = new Date(p.at).toLocaleString(undefined, { weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' });
    const maps = (pl) => 'https://www.google.com/maps/search/?api=1&query=' + pl.lat + ',' + pl.lon;
    const row = (pl, k, cls) => '<div class="stop"><span class="dot ' + cls + '"></span><div><div class="k">' + k + '</div><a target="_blank" rel="noopener" href="' + maps(pl) + '">' + esc(pl.name) + '</a></div></div>';
    box.innerHTML = '<div class="title">' + esc(p.title || 'Group ride') + '</div><div class="when">' + esc(when) + '</div>' + (p.by ? '<div class="by">Planned by ' + esc(p.by) + '</div>' : '') +
      row(p.meet, 'Meet at', '') + p.stops.map((s, i) => row(s, 'Stop ' + (i + 1), 's')).join('') + (p.dest ? row(p.dest, 'Destination', 'd') : '') +
      '<button class="btn cal" id="cal" type="button">Add to calendar</button>';
    box.hidden = false;
    document.getElementById('sub').textContent = (p.by || 'Your group') + ' planned a ride with RideComm.';
    document.getElementById('cal').addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([ics(p)], { type: 'text/calendar;charset=utf-8' }));
      a.download = 'ride-' + code + '.ics'; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    });
  }
  /** A calendar file: 3 hours from the start, a reminder an hour before, the stops and this invite (same as the ride page's). */
  function ics(p) {
    const link = 'https://saquelain.github.io/intercomm-app/join/?code=' + code + (pass ? '#' + pass : '');
    const utc = (ms) => new Date(ms).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
    const tx = (t) => String(t).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
    const fold = (line) => {
      const out = [];
      while (line.length > 74) { let n = 74; if (/[\uDC00-\uDFFF]/.test(line.charAt(n))) n--; out.push(line.slice(0, n)); line = ' ' + line.slice(n); }
      return out.concat(line).join('\r\n');
    };
    const title = p.title || 'RideComm ride';
    const desc = ['Meet at ' + p.meet.name].concat(p.stops.length ? ['Stops: ' + p.stops.map((s) => s.name).join(', ')] : [],
      p.dest ? ['Destination: ' + p.dest.name] : [], ['Ride code: ' + code, 'Join: ' + link]).join('\n');
    return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//RideComm//Ride planner//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
      'BEGIN:VEVENT', 'UID:ride-' + code + '-' + p.at + '@ridecomm', 'DTSTAMP:' + utc(Date.now()), 'DTSTART:' + utc(p.at), 'DTEND:' + utc(p.at + 3 * 3600000),
      'SUMMARY:' + tx(title), 'LOCATION:' + tx(p.meet.name), 'GEO:' + p.meet.lat.toFixed(6) + ';' + p.meet.lon.toFixed(6), 'DESCRIPTION:' + tx(desc), 'URL:' + link,
      'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + tx(title + ' starts in an hour'), 'TRIGGER:-PT60M', 'END:VALARM',
      'END:VEVENT', 'END:VCALENDAR'].map(fold).join('\r\n') + '\r\n';
  }
</script>
</body>
</html>
