<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RideComm · Active Ride</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;color:#fff;background:#121448;min-height:100vh}button,input{font:inherit}button{cursor:pointer;color:inherit}.screen{position:relative;isolation:isolate;max-width:520px;margin:auto;min-height:100dvh;padding:24px 24px 112px;overflow:hidden;background:radial-gradient(ellipse at 0 12%,#454bfa 0,transparent 44%),radial-gradient(ellipse at 110% 24%,#b72ab9 0,transparent 45%),radial-gradient(ellipse at 5% 85%,#b51ca8 0,transparent 40%),radial-gradient(ellipse at 105% 90%,#0875f5 0,transparent 44%),linear-gradient(145deg,#192b8e,#251253 62%,#080d4b)}.screen:before,.screen:after{content:"";position:absolute;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(2px)}.screen:before{width:370px;height:370px;top:-230px;right:-160px;background:radial-gradient(circle at 40% 65%,#ff66e7,transparent 65%);box-shadow:0 0 120px #e336e466}.screen:after{width:320px;height:320px;bottom:-180px;left:-190px;background:radial-gradient(circle,#f83ad9,transparent 72%)}.status{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:650;margin-bottom:38px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{font-size:12px;font-weight:750;letter-spacing:2px;color:#c8c3f9}.code{font-size:clamp(36px,10vw,60px);font-weight:850;letter-spacing:5px;margin:5px 0 0;line-height:1.2}.header-actions{display:flex;gap:10px;align-items:center}.circle{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;flex:none}.glass{background:linear-gradient(135deg,#ffffff36,#ffffff0c 62%,#a4d7ff24);border:1px solid #ffffff69;box-shadow:inset 0 1px #ffffff50,0 12px 28px #090b4c35;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}.sos{background:linear-gradient(140deg,#ff797c,#fc2488);border:1px solid #ffb7cb;box-shadow:0 0 25px #ff4e9d66;font-size:17px;font-weight:900}.connection{display:inline-flex;align-items:center;gap:9px;padding:12px 16px;border-radius:100px;margin:26px 0 20px;font-size:13px;font-weight:650}.dot{width:10px;height:10px;border-radius:50%;background:#0ee7a8;box-shadow:0 0 14px #0ee7a8}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat{padding:15px 12px;border-radius:23px;min-width:0}.stat-icon{font-size:19px;color:#b9faff}.number{font-size:clamp(23px,6vw,35px);font-weight:800;white-space:nowrap;margin-top:8px}.unit{font-size:12px;font-weight:600}.muted{color:#d0c7e8;font-size:13px}.action{width:100%;min-height:76px;display:flex;align-items:center;gap:16px;text-align:left;padding:18px 20px;border-radius:28px;margin-top:18px}.action strong{font-size:18px;line-height:1.2}.action .arrow{margin-left:auto;font-size:27px;font-weight:300}.icon-tile{width:49px;height:49px;flex:none;display:grid;place-items:center;border-radius:18px;background:#27b8ff38;color:#36eaff;font-size:24px}.hazard .icon-tile{background:#ff9d4d50;color:#fff}.destination{margin-top:22px}.riders{margin-top:18px;padding:15px 19px;border-radius:25px;display:flex;justify-content:space-between;align-items:center}.riders strong{font-size:13px;letter-spacing:1.5px;color:#d3c6ec}.pill{padding:10px 12px;border-radius:30px;background:#4f99fa42;border:1px solid #ffffff50;font-size:13px}.blue-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#1ed9f5;margin-right:7px}.controls{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:18px;padding:22px 18px;border-radius:30px}.control{display:flex;align-items:center;flex-direction:column;gap:9px;background:none;border:0;font-size:13px;font-weight:600;min-width:70px}.control .circle{width:68px;height:68px;font-size:30px}.leave{background:linear-gradient(145deg,#ff689a88,#ae2e8a77)}.share{background:linear-gradient(145deg,#5b9cf999,#303dbb88)}.mic .circle{width:100px;height:100px;font-size:43px;background:linear-gradient(140deg,#17f4bc,#0cb5c3);border:5px solid #ffffff65;box-shadow:0 0 0 7px #4dfde944,0 0 30px #16e6cc88}.mic.off .circle{background:linear-gradient(145deg,#9c99ae,#56526c);box-shadow:0 0 0 7px #ffffff22}.mic .mic-label{color:#20f0b4}.nav{height:48px;background:#eff0f5;position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-around;color:#85858b;font-size:25px}.toast{position:fixed;bottom:65px;left:50%;transform:translateX(-50%);background:#161c54f0;border:1px solid #ffffff70;padding:12px 18px;border-radius:14px;box-shadow:0 10px 30px #0007;z-index:10;max-width:90%;text-align:center;display:none}.toast.show{display:block}.dialog-backdrop{position:fixed;inset:0;background:#07071dbb;z-index:20;display:none;place-items:center;padding:20px}.dialog-backdrop.open{display:grid}.dialog{width:min(100%,380px);padding:24px;border-radius:28px;background:linear-gradient(135deg,#4647a6ef,#662b86ef);border:1px solid #ffffff77;box-shadow:0 25px 70px #0008;backdrop-filter:blur(20px)}.dialog h2{margin:0 0 14px;font-size:22px}.dialog p{color:#e4ddf6;font-size:14px}.dialog input{width:100%;padding:14px;border:1px solid #ffffff70;background:#ffffff20;border-radius:14px;color:#fff;outline:none}.dialog footer{display:flex;gap:10px;margin-top:20px}.dialog footer button{border-radius:13px;padding:12px 16px;border:1px solid #ffffff66;background:#ffffff26;flex:1}.dialog footer button.primary{background:linear-gradient(90deg,#fc7b40,#fb398e);border:0;font-weight:750}@media(max-width:360px){.screen{padding-left:15px;padding-right:15px}.code{letter-spacing:2px}.circle{width:46px;height:46px}.controls{padding:18px 10px}.mic .circle{width:86px;height:86px}.control .circle{width:58px;height:58px}}
</style></head><body><main class="screen"><div class="status"><span>4:41 ◉</span><span>◆ ◉ ▂▃▅ ▰80</span></div><header class="header"><div><div class="eyebrow">RIDE CODE</div><div class="code" id="rideCode">H5RDVF</div></div><div class="header-actions"><button class="circle glass" aria-label="Settings" onclick="openDialog('settings')">⚙</button><button class="circle sos" onclick="openDialog('sos')">SOS</button></div></header><div class="connection glass"><span class="dot"></span><span>Connected · 1 rider · 0.1 MB</span></div><section class="stats"><div class="stat glass"><div class="stat-icon">◴</div><div class="number">0<span class="unit"> km/h</span></div><div class="muted">Speed</div></div><div class="stat glass"><div class="stat-icon">⌁</div><div class="number">0.0<span class="unit"> km</span></div><div class="muted">Distance</div></div><div class="stat glass"><div class="stat-icon">◷</div><div class="number" id="elapsed">0:00<span class="unit"> h</span></div><div class="muted">Riding</div></div></section><button class="action glass destination" onclick="openDialog('destination')"><span class="icon-tile">⚑</span><strong id="destinationLabel">Where are we heading?</strong><span class="arrow">→</span></button><button class="action glass" onclick="openDialog('map')"><span class="icon-tile">◫</span><span><strong>Group map</strong><br><span class="muted">1 of 1 riders on the map · set a regroup point</span></span><span class="arrow">→</span></button><button class="action glass hazard" onclick="openDialog('hazard')"><span class="icon-tile">⚠</span><strong>Mark a road hazard</strong><span class="arrow">→</span></button><section class="riders glass"><strong>RIDERS</strong><button class="pill" onclick="openDialog('riders')"><span class="blue-dot"></span>On the map ⌄</button></section><section class="controls glass"><button class="control" onclick="openDialog('leave')"><span class="circle glass leave">⇥</span><span>Leave</span></button><button id="micButton" class="control mic" onclick="toggleMic()"><span class="circle">♩</span><span class="mic-label" id="micLabel">Mic on</span></button><button class="control" onclick="shareRide()"><span class="circle glass share">•</span><span>Share</span></button></section><div class="nav"><span>Ⅲ</span><span>▢</span><span>‹</span></div></main><div class="toast" id="toast" role="status"></div><div class="dialog-backdrop" id="backdrop" onclick="if(event.target===this)closeDialog()"><div class="dialog" role="dialog" aria-modal="true"><h2 id="dialogTitle"></h2><p id="dialogText"></p><input id="dialogInput" style="display:none" placeholder="Enter destination"><footer><button onclick="closeDialog()">Cancel</button><button class="primary" id="dialogConfirm">Continue</button></footer></div></div><script>
let micOn=true;let toastTimer;const $=id=>document.getElementById(id);function toast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),3000)}function toggleMic(){micOn=!micOn;$('micButton').classList.toggle('off',!micOn);$('micLabel').textContent=micOn?'Mic on':'Mic off';$('micButton').querySelector('.circle').textContent=micOn?'♩':'×';toast(micOn?'Microphone enabled (UI demo)':'Microphone muted (UI demo)')}function closeDialog(){$('backdrop').classList.remove('open')}function openDialog(type){const content={settings:['Ride settings','Settings are a placeholder until connected to the app.'],sos:['Emergency SOS','This is a UI demo and cannot contact emergency services.'],destination:['Set destination','Enter where your group is heading.'],map:['Group map','Connect a maps SDK to display live rider locations and regroup points.'],hazard:['Road hazard','Hazard reporting requires location and backend integration.'],riders:['Riders on map','1 rider is currently shown as connected.'],leave:['Leave ride?','Leave this demo ride session?']}[type];$('dialogTitle').textContent=content[0];$('dialogText').textContent=content[1];$('dialogInput').style.display=type==='destination'?'block':'none';$('dialogConfirm').onclick=()=>{if(type==='destination'){const value=$('dialogInput').value.trim();if(value)$('destinationLabel').textContent=value;else return toast('Enter a destination')}else if(type==='leave')toast('Demo ride ended');else if(type==='sos')toast('Demo only — no SOS alert sent');else toast('Preview only — integration needed');closeDialog()};$('backdrop').classList.add('open')}async function shareRide(){const message='Join my RideComm ride: '+$('rideCode').textContent;if(navigator.share){try{await navigator.share({title:'RideComm',text:message});return}catch(e){if(e.name==='AbortError')return}}if(navigator.clipboard){try{await navigator.clipboard.writeText(message);toast('Ride code copied');return}catch(e){}}toast(message)}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog()});
</script></body></html>
