<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#25126c" />
<title>RideComm — Glassmorphism Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#fff;background:#17145c;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow-x:hidden}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:3px solid #ffe69d;outline-offset:3px}.scene{min-height:100vh;position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 2% 13%,#5278ff 0%,transparent 37%),radial-gradient(ellipse at 95% 27%,#bb3cda 0%,transparent 36%),radial-gradient(ellipse at 15% 84%,#9d27cb 0%,transparent 40%),radial-gradient(ellipse at 100% 88%,#1266e7 0%,transparent 40%),linear-gradient(145deg,#2c257f,#20165f 55%,#151353)}.scene:before,.scene:after{content:"";position:absolute;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(1px)}.scene:before{width:390px;height:390px;top:-220px;left:-130px;background:radial-gradient(circle at 65% 70%,#9b9eff,#6a61ff 58%,transparent 73%);box-shadow:0 0 90px #a278ff88}.scene:after{width:340px;height:340px;right:-230px;top:270px;background:radial-gradient(circle at 30% 45%,#ff7ff0,#d936d7 65%,transparent 75%);box-shadow:0 0 90px #ef61ee77}.orb{position:absolute;z-index:-1;pointer-events:none;border-radius:50%}.orb.one{width:280px;height:280px;left:-170px;bottom:90px;background:radial-gradient(circle at 70% 35%,#f983e3,#a927c6 60%,transparent 73%)}.orb.two{width:240px;height:240px;right:-170px;bottom:220px;background:radial-gradient(circle at 30% 40%,#7de9ff,#228aff 65%,transparent 76%)}.app{max-width:480px;margin:0 auto;padding:20px 20px 36px;position:relative}.status{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;margin:0 3px 31px}.status-right{display:flex;gap:9px;align-items:center}.battery{border-radius:8px;padding:3px 7px;background:#ffffffd9;color:#1b2472;font-size:12px}.header{display:flex;align-items:center;gap:14px;margin-bottom:25px}.logo{width:68px;height:68px;border:1.5px solid #ffd6f6b8;border-radius:23px;display:grid;place-items:center;flex-shrink:0;background:linear-gradient(135deg,#ffbc3d,#ff5d5f 55%,#f22ebc);box-shadow:0 8px 30px #ff43c655,inset 0 1px 2px #ffffff90}.logo svg{width:39px;height:39px}.brand{min-width:0;flex:1}.brand h1{font-size:clamp(29px,8vw,39px);letter-spacing:-1.7px;margin:0 0 4px;font-weight:800}.brand p{font-size:13px;color:#d2c9ff;margin:0;font-weight:600;white-space:nowrap}.round{display:grid;place-items:center;flex-shrink:0;border-radius:50%;width:53px;height:53px;border:1px solid #ffffff70;background:linear-gradient(135deg,#ffffff40,#ffffff10);box-shadow:inset 0 1px 2px #ffffff45,0 5px 22px #26177e33;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.round svg{width:24px;height:24px}.glass{border:1.4px solid #ffffff7b;border-radius:30px;background:linear-gradient(125deg,#ffffff3e,#ffffff12 55%,#ffffff22);box-shadow:inset 0 1px 2px #ffffff70,0 13px 40px #130e5d3d,0 0 20px #d761ff25;backdrop-filter:blur(24px) saturate(135%);-webkit-backdrop-filter:blur(24px) saturate(135%)}.profile{padding:23px 21px 22px;margin-bottom:16px}.rider{display:flex;gap:15px;align-items:center;margin-bottom:23px}.avatar{width:74px;height:74px;flex-shrink:0;object-fit:cover;border-radius:50%;border:2px solid #b0d7ff;box-shadow:0 0 14px #48b8ff90}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.6px;color:#d3c9fa}.rider-name{font-size:25px;letter-spacing:-.8px;font-weight:800;margin-top:5px}.edit{margin-left:auto;width:47px;height:47px}.gradient-btn{border:1.5px solid #ffbdf0;border-radius:100px;background:linear-gradient(105deg,#ffb72d,#ff665a 48%,#f326a9);box-shadow:0 0 20px #ff64cb8a,inset 0 1px 2px #ffffff90;font-weight:800;display:flex;justify-content:center;align-items:center;gap:12px;width:100%;min-height:65px;font-size:17px}.gradient-btn svg{width:25px;height:25px}.join{padding:22px 20px 18px;margin-bottom:17px}.join label{display:block;margin:0 3px 12px}.code-wrap{position:relative}.code{width:100%;height:76px;text-align:center;letter-spacing:5px;font-size:clamp(19px,5vw,26px);font-weight:800;text-transform:uppercase;color:white;border-radius:23px;border:1px solid #ffffff88;background:linear-gradient(110deg,#ffffff43,#ffffff15);box-shadow:inset 0 2px 5px #ffffff25;outline:none;padding:0 12px}.code::placeholder{color:#ffffffa0;opacity:1}.join-btn{margin:16px 0 21px;width:100%;min-height:58px;border-radius:100px;border:1px solid #ffffff75;background:linear-gradient(105deg,#e8a6e34d,#4b8ffb50);box-shadow:inset 0 1px 2px #ffffff66;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}.join-btn:disabled{opacity:.58;cursor:not-allowed}.join-btn svg{width:21px}.divider{height:1px;background:linear-gradient(90deg,transparent,#ffffff45,transparent);margin-bottom:18px}.recent{margin-top:12px;border:1px solid #ffffff6b;border-radius:20px;background:linear-gradient(100deg,#f4a2e34a,#4b92ff54);padding:15px 16px;display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;box-shadow:inset 0 1px 2px #ffffff45}.recent strong{font-size:18px}.recent small{display:block;color:#d8d0fb;font-size:13px;margin-top:4px}.chev{width:37px;height:37px;border:1px solid #ffffff65;border-radius:50%;display:grid;place-items:center;background:#ffffff21;font-size:27px}.shortcuts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.shortcut{min-width:0;min-height:91px;border-radius:24px;border:1px solid #ffffff67;background:linear-gradient(145deg,#ffffff40,#ffffff0c);box-shadow:inset 0 1px 2px #ffffff58,0 5px 20px #140c6433;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;font-size:12px;font-weight:600;color:#eee5ff}.shortcut svg{width:25px;height:25px;color:#fff}.shortcut:active,.round:active,.recent:active,.gradient-btn:active{transform:scale(.98)}.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(15px);width:max-content;max-width:calc(100% - 30px);padding:13px 18px;background:#140f43ec;border:1px solid #ffffff75;border-radius:15px;box-shadow:0 10px 35px #0007;opacity:0;transition:.2s;pointer-events:none;font-size:13px;text-align:center;z-index:10}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(min-width:600px){.app{padding-top:32px}.scene{padding-bottom:40px}}@media(max-width:370px){.app{padding:16px 14px 30px}.header{gap:10px}.logo{width:58px;height:58px}.brand h1{font-size:28px}.brand p{font-size:11px}.round{width:46px;height:46px}.profile,.join{padding-left:16px;padding-right:16px}.shortcut{min-height:83px}}
</style>
</head>
<body>
<div class="scene"><div class="orb one"></div><div class="orb two"></div>
<main class="app">
<div class="status"><span>4:11</span><div class="status-right"><span>◉</span><span>▂▄▆</span><span class="battery">♥ 80</span></div></div>
<header class="header"><div class="logo" aria-label="RideComm logo"><svg viewBox="0 0 48 48" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="35" r="7"/><circle cx="38" cy="35" r="7"/><path d="M11 35l10-15 8 15h9M18 20h12l5 8M20 13h8l5 7M7 19h8"/></svg></div><div class="brand"><h1>RideComm</h1><p>Group intercom for riders</p></div><button class="round" aria-label="Settings" onclick="notify('Settings screen coming soon')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.4 13a8.1 8.1 0 0 0 0-2l2-1.5-2-3.5-2.3.9a8 8 0 0 0-1.7-1L15 3h-4l-.4 2.9a8 8 0 0 0-1.7 1L6.6 6 4.6 9.5l2 1.5a8 8 0 0 0 0 2l-2 1.5 2 3.5 2.3-.9a8 8 0 0 0 1.7 1L11 21h4l.4-2.9a8 8 0 0 0 1.7-1l2.3.9 2-3.5-2-1.5ZM13 15a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z"/></svg></button></header>
<section class="glass profile"><div class="rider"><img class="avatar" src="https://images.unsplash.com/photo-1551632811-561732d1e306?w=180&h=180&fit=crop" alt="Rider profile photo"/><div><div class="eyebrow">RIDING AS</div><div class="rider-name" id="riderName">Saquelain</div></div><button class="round edit" aria-label="Edit rider name" onclick="editName()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m4 20 4.5-1 11-11a2 2 0 0 0-3-3l-11 11L4 20Z"/></svg></button></div><button class="gradient-btn" onclick="startRide()"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="35" r="7"/><circle cx="38" cy="35" r="7"/><path d="M11 35l10-15 8 15h9M18 20h12l5 8M20 13h8l5 7M7 19h8"/></svg>Start a new ride <span aria-hidden="true">›</span></button></section>
<section class="glass join"><label class="eyebrow" for="rideCode">JOIN YOUR GROUP</label><div class="code-wrap"><input class="code" id="rideCode" type="text" maxlength="8" autocomplete="off" spellcheck="false" placeholder="RIDE CODE" aria-label="Ride code" /></div><button class="join-btn" id="joinButton" disabled onclick="joinRide()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16m-7-7 7 7-7 7"/></svg>Join ride</button><div class="divider"></div><div class="eyebrow">RIDE AGAIN</div><button class="recent" onclick="notify('Rejoining ride GMMCBR…')"><span><strong>GMMCBR</strong><small>11 min ago</small></span><span class="chev" aria-hidden="true">›</span></button></section>
<nav class="shortcuts" aria-label="Ride features"><button class="shortcut" onclick="notify('Talk opens during a ride')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M4 14v-3a8 8 0 0 1 16 0v3M4 13h3v7H5a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2Zm13 0h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-3v-7Z"/></svg>Talk</button><button class="shortcut" onclick="notify('Music opens during a ride')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 4v12.3A4 4 0 1 1 8 13V6l12-3v11.3a4 4 0 1 1-2-3.5V1L10 4Z"/></svg>Music</button><button class="shortcut" onclick="notify('Votes opens during a ride')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 10h4v12H2zm6 12h9.1a3 3 0 0 0 2.9-2.2l2-7a3 3 0 0 0-2.9-3.8H14l.8-4.1a3 3 0 0 0-.8-2.6L12.8 1 7 9v13z"/></svg>Votes</button><button class="shortcut" onclick="notify('SOS is available during a ride')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><text x="12" y="16" text-anchor="middle" fill="currentColor" stroke="none" font-size="10" font-weight="800">SOS</text></svg>SOS</button></nav>
</main></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const code=document.getElementById('rideCode');const joinButton=document.getElementById('joinButton');let toastTimeout;code.addEventListener('input',()=>{code.value=code.value.toUpperCase().replace(/[^A-Z0-9]/g,'');joinButton.disabled=code.value.length<4});code.addEventListener('keydown',e=>{if(e.key==='Enter'&&!joinButton.disabled)joinRide()});function notify(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.remove('show'),2600)}function joinRide(){notify('Joining ride '+code.value+'…')}function startRide(){const generated=Math.random().toString(36).slice(2,8).toUpperCase();notify('New ride created: '+generated)}function editName(){const current=document.getElementById('riderName');const next=prompt('Riding as:',current.textContent);if(next&&next.trim()){current.textContent=next.trim().slice(0,24);notify('Rider name updated')}}
</script>
</body></html>
